      #     docker tag stripe-payment-api:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/stripe-payment-api:${{ github.ref_name }}
      #     docker push ${{ secrets.REGISTRY_URL }}/stripe-payment-api:${{ github.ref_name }}
