name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go build
        run: cd backend && go build -o /tmp/server ./cmd/server

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_release_build
        run: |
          npm ci
          npm run build

      - name: Build API image
        run: docker build -t stripe-payment-api:${{ github.sha }} ./backend

      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:8080 \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=pk_test_release_build \
            -t stripe-payment-web:${{ github.sha }} ./frontend

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -summary /work/deploy/kubernetes

      - name: Validate Prometheus manifests
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -kubernetes-version 1.28.0 \
            -summary /work/deploy/prometheus/servicemonitor.yaml \
            /work/deploy/prometheus/prometheusrule.yaml

      # Uncomment and set REGISTRY_* secrets to push images on tag:
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.REGISTRY_URL }}
      #     username: ${{ secrets.REGISTRY_USER }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}
