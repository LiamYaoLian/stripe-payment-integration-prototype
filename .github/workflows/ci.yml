name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: backend

      - name: Go build
        run: cd backend && go build -o /tmp/server ./cmd/server

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

      - name: Go unit tests
        run: cd backend && go test -short ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stripe
          POSTGRES_PASSWORD: stripe
          POSTGRES_DB: stripe_payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stripe -d stripe_payment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run migrations
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/backend/migrations:/migrations" \
            migrate/migrate:v4.18.2 \
            -path=/migrations \
            -database "postgresql://stripe:stripe@localhost:5432/stripe_payment?sslmode=disable" \
            up

      - name: DB integration tests
        env:
          DATABASE_URL: postgresql://stripe:stripe@localhost:5432/stripe_payment?sslmode=disable
        run: cd backend && go test ./internal/db/...
