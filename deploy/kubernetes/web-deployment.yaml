apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-payment-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stripe-payment-web
  template:
    metadata:
      labels:
        app: stripe-payment-web
    spec:
      containers:
        - name: web
          # Build with: docker build --build-arg NGINX_CONF=nginx.k8s.conf --build-arg VITE_API_URL= ...
          image: stripe-payment-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            timeoutSeconds: 3
